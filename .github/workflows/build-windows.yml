name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to attach the zip to a release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      # The photo model (~170 MB) and fonts are downloaded by run.py --setup; keep them between runs.
      - uses: actions/cache@v4
        with:
          path: |
            models
            fonts
          key: assets-${{ hashFiles('run.py') }}

      - name: Install packages, font and photo model
        run: |
          python -m pip install --upgrade pip
          python run.py --setup
          python -m pip install "pyinstaller>=6.3" "pywebview>=5.0"

      # Release builds know their version, so the app can tell when a newer release is out.
      - name: Stamp version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -c "import sys; open('version.py', 'w').write('VERSION = %r\n' % sys.argv[1])" "${{ github.ref_name }}"

      - name: Build CardStudio.exe
        run: python -m PyInstaller --noconfirm --clean CardStudio.spec

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\CardStudio -DestinationPath CardStudio-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CardStudio-windows
          path: dist/CardStudio
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CardStudio-windows.zip
