<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · LMC Card Studio</title>
<style>
  :root { --bg: #f6f4f2; --panel: #fff; --ink: #1f1d1b; --muted: #6d6863; --line: #e3dfdb; --brand: #9b2226; --field: #fbfaf9; --bad: #9b2226; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161514; --panel: #1f1e1c; --ink: #f1eeea; --muted: #a39d97; --line: #34312e; --brand: #c4373c; --field: #262422; --bad: #f19a9c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 16px; }
  form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
  h1 { font-size: 20px; margin: 0 0 4px; } h1 span { color: var(--brand); }
  p { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); color: var(--ink); font: inherit; }
  button { width: 100%; margin-top: 20px; padding: 11px; border: 0; border-radius: 9px; background: var(--brand); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; }
  #err { color: var(--bad); font-size: 13.5px; min-height: 1.4em; margin-top: 12px; }
</style>
</head>
<body>
<form id="f">
  <h1><span>LMC</span> Card Studio</h1>
  <p>Sign in to create and print ID cards.</p>
  <label for="u">Username</label>
  <input id="u" autocomplete="username" required autofocus>
  <label for="p">Password</label>
  <input id="p" type="password" autocomplete="current-password" required>
  <button id="b">Sign in</button>
  <div id="err" role="alert"></div>
</form>
<script>
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const b = document.getElementById("b"), err = document.getElementById("err");
  b.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: document.getElementById("u").value, password: document.getElementById("p").value }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Sign-in failed.");
    location.href = "/";
  } catch (x) { err.textContent = x.message; b.disabled = false; }
});
</script>
</body>
</html>
